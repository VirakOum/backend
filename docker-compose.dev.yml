services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly no --save "" --maxmemory 64mb --maxmemory-policy allkeys-lru
    ports:
      - "${DEV_REDIS_PORT:-127.0.0.1:6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    networks:
      - default
      - coolify

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mytravel_dev}
      POSTGRES_USER: ${POSTGRES_USER:-fastapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fastapi}
    ports:
      - "${DEV_DB_PORT:-127.0.0.1:5434}:5432"
    volumes:
      - mytravel_dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fastapi} -d ${POSTGRES_DB:-mytravel_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"
    networks:
      - default
      - coolify

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://dev.mytravel.taxi}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-fastapi}:${POSTGRES_PASSWORD:-fastapi}@db:5432/${POSTGRES_DB:-mytravel_dev}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      FASTAPI_ROOT_PATH: ${FASTAPI_ROOT_PATH:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      GOOGLE_PLACES_API_KEY_ANDROID: ${GOOGLE_PLACES_API_KEY_ANDROID:-}
      GOOGLE_PLACES_API_KEY_IOS: ${GOOGLE_PLACES_API_KEY_IOS:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      SUPPORT_TELEGRAM_USERNAME: ${SUPPORT_TELEGRAM_USERNAME:-ride_support}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-MyTravel_Taxi_bot}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      SUPPORT_PHONE: ${SUPPORT_PHONE:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      SAFETY_POLICE_NUMBER: ${SAFETY_POLICE_NUMBER:-117}
      SAFETY_FIRE_NUMBER: ${SAFETY_FIRE_NUMBER:-118}
      SAFETY_AMBULANCE_NUMBER: ${SAFETY_AMBULANCE_NUMBER:-119}
      SAFETY_COUNTRY_CODE: ${SAFETY_COUNTRY_CODE:-KH}
      ENABLE_DIGITAL_PAYMENT: ${ENABLE_DIGITAL_PAYMENT:-false}
      DEFAULT_DRIVER_CASH_DEBT_LIMIT_USD: ${DEFAULT_DRIVER_CASH_DEBT_LIMIT_USD:-20}
      DEFAULT_DRIVER_CASH_DEBT_LIMIT_KHR: ${DEFAULT_DRIVER_CASH_DEBT_LIMIT_KHR:-80000}
      AUTO_LOCK_DRIVER_ON_DEBT_LIMIT: ${AUTO_LOCK_DRIVER_ON_DEBT_LIMIT:-true}
    labels:
      - "coolify.managed=true"
      - "traefik.http.services.app.loadbalancer.server.port=8000"
    command: >
      sh -c "alembic upgrade head &&
      if [ \"$$SEED_DEMO_DATA\" = \"true\" ]; then python3 scripts/seed_demo_data.py || true; fi &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-2}"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"
    networks:
      - default
      - coolify

volumes:
  mytravel_dev_postgres_data:

networks:
  default:
  coolify:
    name: coolify
    external: true
