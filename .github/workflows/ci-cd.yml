name: Backend CI/CD (Dev & Production)

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main

jobs:
  test-backend:
    name: Run FastAPI Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest suite
        env:
          PYTHONPATH: .
        run: |
          pytest tests/test_telegram_otp_api.py tests/test_universal_links.py tests/test_routing_and_site.py tests/test_app_version_api.py

  verify-deploy:
    name: Verify Server Deployment Health
    needs: test-backend
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check target environment URL
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "Target environment: http://dev.mytravel.taxi"
          else
            echo "Target environment: https://mytravel.taxi"
          fi
