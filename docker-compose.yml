services:
  db:
    image: postgres:16-alpine
    container_name: fastapi_learning_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fastapi_learning
      POSTGRES_USER: fastapi
      POSTGRES_PASSWORD: fastapi
    ports:
      - "5432:5432"
    volumes:
      - fastapi_learning_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastapi -d fastapi_learning"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: fastapi_learning_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://fastapi:fastapi@db:5432/fastapi_learning
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  fastapi_learning_postgres_data:
