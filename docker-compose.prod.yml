services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fastapi_learning}
      POSTGRES_USER: ${POSTGRES_USER:-fastapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fastapi}
    volumes:
      - fastapi_learning_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fastapi} -d ${POSTGRES_DB:-fastapi_learning}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://fastapi:fastapi@db:5432/fastapi_learning}
      FASTAPI_ROOT_PATH: ${FASTAPI_ROOT_PATH:-/v1/api}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-AIzaSyADL_kclBCW_GULlB7k7rojC584wMku1yQ}
      GOOGLE_PLACES_API_KEY_ANDROID: ${GOOGLE_PLACES_API_KEY_ANDROID:-AIzaSyAoletVeVPIxwAp6Zsw6Z0iefvSWT3McM4}
      GOOGLE_PLACES_API_KEY_IOS: ${GOOGLE_PLACES_API_KEY_IOS:-AIzaSyC3ZmVOtLwfqCsSBiLJg8fRZNQ9QgBxw-M}
      SUPPORT_TELEGRAM_USERNAME: ${SUPPORT_TELEGRAM_USERNAME:-ride_support}
      SUPPORT_PHONE: ${SUPPORT_PHONE:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      SAFETY_POLICE_NUMBER: ${SAFETY_POLICE_NUMBER:-117}
      SAFETY_FIRE_NUMBER: ${SAFETY_FIRE_NUMBER:-118}
      SAFETY_AMBULANCE_NUMBER: ${SAFETY_AMBULANCE_NUMBER:-119}
      SAFETY_COUNTRY_CODE: ${SAFETY_COUNTRY_CODE:-KH}
      ENABLE_DIGITAL_PAYMENT: ${ENABLE_DIGITAL_PAYMENT:-false}
      DEFAULT_DRIVER_CASH_DEBT_LIMIT_USD: ${DEFAULT_DRIVER_CASH_DEBT_LIMIT_USD:-20}
      DEFAULT_DRIVER_CASH_DEBT_LIMIT_KHR: ${DEFAULT_DRIVER_CASH_DEBT_LIMIT_KHR:-80000}
      AUTO_LOCK_DRIVER_ON_DEBT_LIMIT: ${AUTO_LOCK_DRIVER_ON_DEBT_LIMIT:-true}
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.mytravel-backend.rule=Host(`mytravel.taxi`)"
      - "traefik.http.routers.mytravel-backend.entrypoints=websecure"
      - "traefik.http.routers.mytravel-backend.tls=true"
      - "traefik.http.routers.mytravel-backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mytravel-backend.priority=10000"
      - "traefik.http.services.mytravel-backend.loadbalancer.server.port=8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  fastapi_learning_postgres_data:

networks:
  default:
    name: coolify
    external: true
